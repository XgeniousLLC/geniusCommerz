  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22      # ← Changed to 22
          cache: "npm"

      - name: Clean Install Dependencies
        run: |
          npm ci --legacy-peer-deps   # Helps with peer dependency issues

      - name: Build Assets
        run: npm run build

      - name: Verify Build
        run: test -f public/build/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build/
          retention-days: 7
