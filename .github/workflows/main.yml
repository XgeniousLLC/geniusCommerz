name: Deploy Application

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Verify Build
        run: test -f public/build/manifest.json

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: build-output

      - name: Upload Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MAIN_SSH_HOST }}
          username: ${{ secrets.SSH_MAIN_USERNAME }}
          key: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
          source: "build-output/*"
          target: "/home/poshivo/htdocs/poshivo.com/_incoming_build"
          strip_components: 1

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.MAIN_SSH_HOST }}
          username: ${{ secrets.SSH_MAIN_USERNAME }}
          key: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="/home/poshivo/htdocs/poshivo.com"
            REPO_URL="git@github.com:Sharifur/poshivo.git"
            BRANCH="main"
            BACKUP_DIR="/home/poshivo/backups/deploy_$(date +%Y%m%d_%H%M%S)"
            INCOMING="$APP_DIR/_incoming_build"
            BUILD_TARGET="$APP_DIR/public/build"

            mkdir -p "$BACKUP_DIR"
            [ -f "$INCOMING/manifest.json" ] || { echo "❌ Build artifacts missing"; exit 1; }

            cd "$APP_DIR"

            # First-time Git setup
            if [ ! -d ".git" ]; then
              echo "🛠 First time setup - initializing git..."
              [ -f .env ] && cp .env "$BACKUP_DIR/.env"
              git init -q
              git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              git checkout -B "$BRANCH" --track "origin/$BRANCH" 2>/dev/null || true
              [ -f "$BACKUP_DIR/.env" ] && cp "$BACKUP_DIR/.env" .env
            fi

            cp .env "$BACKUP_DIR/.env" 2>/dev/null || true

            git config --global --add safe.directory "$APP_DIR" || true
            PREVIOUS_SHA=$(git rev-parse HEAD 2>/dev/null || echo "none")

            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd -e .env -e storage -e bootstrap/cache -e _incoming_build -e public/build

            mkdir -p storage/framework/{cache,sessions,views,testing} storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            rollback() {
              echo "↩️ Rolling back deployment..."
              git reset --hard "$PREVIOUS_SHA" 2>/dev/null || true
              [ -f "$BACKUP_DIR/.env" ] && cp "$BACKUP_DIR/.env" .env
              [ -d "$BACKUP_DIR/build.old" ] && rm -rf "$BUILD_TARGET" && mv "$BACKUP_DIR/build.old" "$BUILD_TARGET"
              php artisan up || true
              exit 1
            }
            trap rollback ERR

            php artisan down --retry=60 || true

            composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader --no-progress

            [ -d "$BUILD_TARGET" ] && mv "$BUILD_TARGET" "$BACKUP_DIR/build.old"
            mv "$INCOMING" "$BUILD_TARGET"
            [ -f "$BUILD_TARGET/manifest.json" ] || { echo "❌ manifest.json missing"; exit 1; }

            php artisan migrate --force --no-interaction
            php artisan storage:link --force || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache || true
            php artisan queue:restart || true

            php artisan up

            trap - ERR

            chown -R poshivo:poshivo "$APP_DIR" || true

            # Keep only last 5 backups
            cd /home/poshivo/backups
            ls -1dt deploy_* 2>/dev/null | tail -n +6 | xargs -r rm -rf

            echo "✅ Deployment Successful!"
            echo "Previous SHA: $PREVIOUS_SHA → Current: $(git rev-parse HEAD)"
